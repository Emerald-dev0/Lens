<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harbor — customer operations, simplified</title>
    <meta name="description" content="Harbor is a small demo application shipped with Lens so agents can practice real browser workflows." />
    <meta property="og:title" content="Harbor — customer operations, simplified" />
    <meta property="og:description" content="Demo application used by Lens to verify visual review, flows and showcases." />
    <meta property="og:type" content="website" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="/favicon.svg" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header class="topbar" data-testid="topbar">
      <div class="topbar__inner">
        <a class="brand" href="#/" aria-label="Harbor home">
          <span class="brand__mark" aria-hidden="true"></span>
          <span class="brand__name">Harbor</span>
        </a>
        <nav class="nav" aria-label="Primary">
          <a class="nav__link" href="#/dashboard">Dashboard</a>
          <a class="nav__link" href="#/projects">Projects</a>
          <a class="nav__link" href="#/pricing">Pricing</a>
          <a class="nav__link" href="#/docs">Docs</a>
          <a class="nav__link" href="#/changelog">Changelog</a>
          <a class="nav__link" href="#/support">Support&nbsp;centre&nbsp;with&nbsp;a&nbsp;very&nbsp;long&nbsp;label</a>
        </nav>
        <div class="topbar__actions">
          <button class="btn btn--ghost" data-action="sign-in">Sign in</button>
          <a class="btn btn--primary" href="#/signup" data-testid="cta-signup">Create account</a>
        </div>
      </div>
    </header>

    <main id="main" class="page"></main>

    <footer class="footer">
      <p>Harbor is a fictional demo application bundled with Lens. All data lives in your browser.</p>
      <p class="footer__meta"><span data-testid="build-stamp"></span> · <a href="#/docs">Docs</a></p>
    </footer>

    <div class="modal" id="modal" hidden>
      <div class="modal__backdrop" data-action="close-modal"></div>
      <div class="modal__panel" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal__body"></div>
      </div>
    </div>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
